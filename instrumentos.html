<style>
:root{
  --black:#0a0c12;--surf:#11141d;--panel:#171b27;--card:#1d2130;--card2:#222740;
  --b1:#2a2e42;--b2:#363b56;
  --navy:#1B2A4A;--ora:#00D4AA;--ora2:#ff9a3c;--blu:#008F6E;--blu2:#6aaee8;
  --grn:#2ecc71;--red:#e74c3c;--yel:#f39c12;--pur:#9b59b6;--cyan:#48c9d8;
  --w:#eef0f8;--dim:#8089a8;--mut:#454d6a;
  --fd:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;--fm:'Share Tech Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px;scroll-behavior:smooth}
body{background:var(--black);color:var(--w);font-family:var(--fb);font-size:1rem;line-height:1.6;min-height:100vh}

.top{position:sticky;top:0;z-index:50;height:60px;background:var(--surf);border-bottom:1px solid var(--b1);display:flex;align-items:center;padding:0 5vw;gap:12px}
.logo{display:flex;align-items:center;gap:9px}
.logo svg{width:30px;height:30px}
.brand{font-family:var(--fd);font-weight:800;font-size:1.15rem;letter-spacing:.06em;line-height:1}
.brand b{color:var(--ora)}
.brand span{display:block;font-size:.6rem;letter-spacing:.18em;color:var(--dim);font-weight:600}
.top-title{font-family:var(--fd);font-size:.9rem;font-weight:600;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-left:auto}

.tabs{position:sticky;top:60px;z-index:40;background:var(--panel);border-bottom:1px solid var(--b1);display:flex;overflow-x:auto;padding:0 5vw;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:14px 16px;font-family:var(--fd);font-size:.95rem;font-weight:700;letter-spacing:.03em;color:var(--dim);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab:hover{color:var(--w)}
.tab.on{border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--fm);font-size:.7rem;color:var(--mut);background:var(--card);padding:1px 6px;border-radius:8px}

.wrap{max-width:1180px;margin:0 auto;padding:24px 5vw 80px}
.searchbar{margin-bottom:20px}
.searchbar input{width:100%;background:var(--card);border:1px solid var(--b1);color:var(--w);font-family:var(--fb);font-size:.95rem;padding:12px 16px;border-radius:5px;outline:none;transition:border-color .15s}
.searchbar input:focus{border-color:var(--ora)}
.searchbar input::placeholder{color:var(--mut)}

.view{display:none}
.view.on{display:block}
.view-intro{margin-bottom:22px}
.view-intro h2{font-family:var(--fd);font-size:1.7rem;font-weight:800;margin-bottom:4px}
.view-intro p{color:var(--dim);font-size:.95rem}

.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.icard{background:var(--card);border:1px solid var(--b1);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;border-top:3px solid var(--accent)}
.icard-hd{padding:16px 18px 14px;display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid var(--b1)}
.icard-ico{width:54px;height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--card2);border-radius:8px}
.icard-ico svg{width:38px;height:38px}
.icard-tt{font-family:var(--fd);font-size:1.18rem;font-weight:700;line-height:1.2;margin-bottom:3px}
.icard-sub{font-size:.83rem;color:var(--dim);line-height:1.4}
.icard-bd{padding:14px 18px;display:flex;flex-direction:column;gap:13px;flex:1}
.isec-lbl{font-family:var(--fd);font-size:.72rem;font-weight:700;letter-spacing:.13em;color:var(--accent);text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.ilist{display:flex;flex-direction:column;gap:5px;padding-left:0}
.ilist li{list-style:none;font-size:.84rem;color:var(--dim);padding-left:14px;position:relative;line-height:1.45}
.ilist li::before{content:'▸';position:absolute;left:0;color:var(--accent);font-size:.78rem}
.ilist.apps li::before{content:'•';color:var(--mut)}
.itip{margin-top:auto;background:linear-gradient(135deg,var(--navy),#16223c);border:1px solid var(--b2);border-left:3px solid var(--ora);border-radius:4px;padding:10px 13px;font-size:.78rem;color:var(--w);line-height:1.5;opacity:.92}
.itip b{color:var(--ora2)}

@media(max-width:600px){
  html{font-size:16px}
  .igrid{grid-template-columns:1fr}
  .top-title{display:none}
  .icard-ico{width:46px;height:46px}
  .icard-ico svg{width:30px;height:30px}
}
@media (pointer: coarse) {
  a, button, input, select, textarea {
    min-height: 44px;
  }
  input, select, textarea {
    font-size: 16px !important;
  }
}

/* Safe area per notch iPhone */
body {
  padding-top: constant(safe-area-inset-top);

}

// ═══════════ RENDER ═══════════
let activeCat='electrico';

function buildTabs(){
  const t=$('tabs');
  t.innerHTML=CATS.map(c=>{
    const n=INSTR.filter(i=>i.cat===c.id).length;
    return `<button class="tab ${c.id===activeCat?'on':''}" data-cat="${c.id}" style="--accent:${c.accent};${c.id===activeCat?'color:'+c.accent:''}" onclick="setCat('${c.id}')">${c.name} <span class="cnt">${n}</span></button>`;
  }).join('');
}

function setCat(id){
  activeCat=id;
  const c=CATS.find(c=>c.id===id);
  document.documentElement.style.setProperty('--accent',c.accent);
  $('cat-title').textContent=c.name;
  $('cat-desc').textContent=c.desc;
  buildTabs();
  render();
}

function render(){
  const q=$('search').value.toLowerCase().trim();
  const c=CATS.find(c=>c.id===activeCat);
  let items=INSTR.filter(i=>i.cat===activeCat);
  if(q){
    items=items.filter(i=>
      i.name.toLowerCase().includes(q)||
      i.sub.toLowerCase().includes(q)||
      i.specs.some(s=>s.toLowerCase().includes(q))||
      i.apps.some(a=>a.toLowerCase().includes(q))
    );
  }
  const grid=$('grid');
  if(!items.length){
    grid.innerHTML=`<div style="color:var(--mut);padding:30px;text-align:center;grid-column:1/-1">Nessun risultato per questa ricerca in questa categoria.</div>`;
    return;
  }
  grid.innerHTML=items.map(i=>`
    <div class="icard" style="--accent:${c.accent}">
      <div class="icard-hd">
        <div class="icard-ico"><svg viewBox="0 0 38 42">${ic[i.id]||''}</svg></div>
        <div>
          <div class="icard-tt">${i.name}</div>
          <div class="icard-sub">${i.sub}</div>
        </div>
      </div>
      <div class="icard-bd">
        <div>
          <div class="isec-lbl">⚙ Caratteristiche</div>
          <ul class="ilist">${i.specs.map(s=>`<li>${s}</li>`).join('')}</ul>
        </div>
        <div>
          <div class="isec-lbl">🔧 Applicazioni</div>
          <ul class="ilist apps">${i.apps.map(a=>`<li>${a}</li>`).join('')}</ul>
        </div>
        <div class="itip">💡 ${i.tip}</div>
      </div>
    </div>`).join('');
}

// ═══════════ INIT ═══════════
